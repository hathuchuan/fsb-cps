# Mỗi lần push lên main: dựng lại index.html từ modules/ rồi đăng lên GitHub Pages.
name: Deploy slide lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dựng index.html
        run: python build_index.py
      - name: Gom file cần đăng
        run: |
          mkdir _site
          cp index.html _site/
          cp -R modules _site/
          [ -d assets ] && cp -R assets _site/ || true
          find _site -name .DS_Store -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
